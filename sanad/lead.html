<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>اطلب عقارك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: one short form, one column, phone-first */
:root{--bg:#ffffff;--fg:#0b0c0b;--muted:#5b625d;--line:#e2e5e1;--surface:#f4f6f2;--accent:#d0f94a;--accent-ink:#0b0c0b;--warn:#a4470f;
  --mark:linear-gradient(135deg,#1aa39a 0%,#5fd6a6 50%,#d0f94a 100%);--f:"Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0c0b;--fg:#f1f3ef;--muted:#9aa29c;--line:#262a27;--surface:#141614;--warn:#f0a06a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0c0b;--fg:#f1f3ef;--muted:#9aa29c;--line:#262a27;--surface:#141614;--warn:#f0a06a;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;line-height:1.65;direction:rtl}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:center;gap:10px}
.logo{width:28px;height:28px;background:var(--mark);position:relative}
.logo::after{content:"";position:absolute;width:6px;height:6px;background:var(--fg);left:5px;bottom:5px}
.top b{font-size:16px;font-weight:800}
h1{font-size:28px;font-weight:800;line-height:1.3;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
form{display:flex;flex-direction:column;gap:14px}
label{font-size:14px;font-weight:800}
.field{display:flex;flex-direction:column;gap:6px}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);padding:11px 12px;border-radius:0;width:100%}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--fg);outline-offset:1px}
.ltr{direction:ltr;text-align:right}
.hp{position:absolute;inset-inline-start:-9999px;width:1px;height:1px;overflow:hidden}
.btn{font:inherit;font-weight:800;font-size:17px;padding:13px 18px;background:var(--fg);color:var(--bg);border:1px solid var(--fg);cursor:pointer}
.btn:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[disabled]{opacity:.55}
.err{color:var(--warn);font-weight:800;font-size:14px}
.done{border:1px solid var(--fg);padding:20px;display:flex;flex-direction:column;gap:8px}
.done b{font-size:20px}
.foot{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo" aria-hidden="true"></div><b id="office">مكتبنا العقاري</b></div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <h1>قل لنا وش تدور عليه، ونرجع لك اليوم.</h1>
    <p class="muted">وسيط مختص بيتواصل معك على واتساب خلال ساعات، ويتابع معك لين تلقى المناسب.</p>
  </div>
  <form id="f" novalidate>
    <div class="field"><label for="n">الاسم</label><input id="n" autocomplete="name"></div>
    <div class="field"><label for="ph">رقم الجوال (واتساب)</label><input id="ph" class="ltr" inputmode="tel" autocomplete="tel" placeholder="05xxxxxxxx"></div>
    <div class="field"><label for="need">وش تبغى؟</label><textarea id="need" placeholder="مثال: شقة ٣ غرف للتمليك بالخبر، الميزانية حدود ٩٠٠ ألف"></textarea></div>
    <div class="hp" aria-hidden="true"><label for="website">لا تعبي هذا الحقل</label><input id="website" tabindex="-1" autocomplete="off"></div>
    <p class="err" id="err" hidden></p>
    <button class="btn" id="btn">أرسل طلبي</button>
    <p class="muted" style="font-size:13px">رقمك يوصل للمكتب فقط، وما نشاركه مع أي جهة.</p>
  </form>
  <div class="done" id="done" hidden><b>وصل طلبك ✓</b><p id="done-msg"></p></div>
  <p class="foot">يعمل بنظام «سند» من هاي لينك</p>
</div>
<script src="config.js"></script>
<script>
const CFG = window.SANAD_CONFIG || {};
const API_URL = CFG.API_URL || "";
const OFFICE_NAME = CFG.OFFICE_NAME || "";
if (OFFICE_NAME) document.getElementById("office").textContent = OFFICE_NAME;
const q = new URLSearchParams(location.search);
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const $ = id => document.getElementById(id), err = $("err"), btn = $("btn");
  err.hidden = true;
  const data = {name:$("n").value, phone:$("ph").value, need:$("need").value, website:$("website").value, propertyId:q.get("p")||"", source:q.get("src")||"نموذج الموقع"};
  if (!data.name.trim() || !data.phone.trim()) { err.textContent = "اكتب اسمك ورقم جوالك."; err.hidden = false; return; }
  btn.disabled = true; btn.textContent = "لحظة…";
  let res;
  if (!API_URL) { await new Promise(r => setTimeout(r, 400)); res = {ok:true, msg:"(نسخة تجريبية) وصل طلبك، بيتواصل معك فريقنا قريب."}; }
  else {
    try { const r = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({action:"lead", data})}); res = await r.json(); }
    catch(x) { res = {ok:false, error:"تعذّر الإرسال. تأكد من الإنترنت وحاول مرة ثانية."}; }
  }
  btn.disabled = false; btn.textContent = "أرسل طلبي";
  if (!res.ok) { err.textContent = res.error; err.hidden = false; return; }
  $("f").hidden = true; $("done").hidden = false; $("done-msg").textContent = res.msg;
});
</script>
</body>
</html>
