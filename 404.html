<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الصفحة غير موجودة — هاي لينك</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#ffffff;--ink:#0a0a0a;--ink-2:#4a4a4a;--ink-3:#767676;--lime:#d0f94a;--on-lime:#0a0a0a;
  --grad-teal:#4ea5a3;--grad-mint:#6eda8e;--grad-lime:#d8f869;--s3:12px;--s4:16px;--s6:24px;--s8:32px;--s12:48px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;align-content:center;background:var(--paper);color:var(--ink);font-family:"Tajawal","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.8;padding:var(--s12) var(--s6)}
main{max-width:640px;margin:0 auto;display:grid;gap:var(--s8)}
.mark{font-weight:800;font-size:20px}
.code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;color:var(--ink-3)}
h1{font-size:44px;font-weight:700;line-height:1.15;margin:0}
.grad{background:linear-gradient(90deg,var(--grad-teal),var(--grad-mint),var(--grad-lime));-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0;color:var(--ink-2)}
.en{direction:ltr;text-align:left;border-top:1px solid #d4d4d4;padding-top:var(--s6);display:grid;gap:var(--s3)}
.en h2{font-size:22px;font-weight:700;margin:0}
.btn{justify-self:start;display:inline-block;font-size:17px;font-weight:500;line-height:1;padding:18px var(--s8);background:var(--lime);color:var(--on-lime);text-decoration:none}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.en a{color:var(--ink)}
@media (max-width:780px){h1{font-size:34px}}
</style>
</head>
<body>
<main>
  <span class="mark">هاي لينك</span>
  <span class="code">404</span>
  <h1>هذي الصفحة <span class="grad">مو موجودة</span>.</h1>
  <p>يمكن الرابط فيه خطأ، أو الصفحة انتقلت. الصفحة الرئيسية فيها كل شي.</p>
  <a class="btn" href="/">ارجع للصفحة الرئيسية</a>
  <div class="en" lang="en">
    <h2>This page doesn't exist.</h2>
    <p>The link may be wrong, or the page has moved. <a href="/?lang=en">Go to the home page</a>.</p>
  </div>
</main>
</body>
</html>
